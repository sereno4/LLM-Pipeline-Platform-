apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary-route
  namespace: gateway
spec:
  parentRefs:
    - name: llm-gateway
      namespace: gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /keras
      backendRefs:
        - name: keras-api
          namespace: keras-pipeline
          port: 80
          weight: 90
        - name: keras-api-v2
          namespace: keras-pipeline
          port: 80
          weight: 10
