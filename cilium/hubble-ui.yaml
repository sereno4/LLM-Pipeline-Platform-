apiVersion: v1
kind: Namespace
metadata:
  name: cilium-monitoring
  labels:
    app: cilium
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hubble-ui
  namespace: cilium-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hubble-ui
rules:
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - componentstatuses
      - endpoints
      - namespaces
      - nodes
      - pods
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hubble-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hubble-ui
subjects:
  - kind: ServiceAccount
    name: hubble-ui
    namespace: cilium-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-ui-envoy
  namespace: cilium-monitoring
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: listener_hubble_ui
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8081
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: hubble_ui
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: local_service
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: /api/
                              route:
                                cluster: backend
                                prefix_rewrite: /
                            - match:
                                prefix: /
                              route:
                                cluster: frontend
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: frontend
          connect_timeout: 30s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: frontend
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 8080
        - name: backend
          connect_timeout: 30s
          type: LOGICAL_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: backend
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: hubble-relay.kube-system.svc.cluster.local
                          port_value: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubble-ui
  namespace: cilium-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hubble-ui
  template:
    metadata:
      labels:
        app: hubble-ui
    spec:
      serviceAccountName: hubble-ui
      containers:
        - name: frontend
          image: quay.io/cilium/hubble-ui:v0.13.1
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "100m"
        - name: backend
          image: quay.io/cilium/hubble-ui-backend:v0.13.1
          env:
            - name: EVENTS_SERVER_PORT
              value: "8090"
            - name: FLOWS_API_ADDR
              value: "hubble-relay.kube-system.svc:80"
          ports:
            - containerPort: 8090
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "100m"
        - name: proxy
          image: docker.io/envoyproxy/envoy:v1.29.3
          command:
            - sh
            - -c
            - |
              envoy -c /etc/envoy/envoy.yaml
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: hubble-ui-envoy
              mountPath: /etc/envoy
              readOnly: true
          resources:
            limits:
              memory: "128Mi"
              cpu: "200m"
            requests:
              memory: "64Mi"
              cpu: "50m"
      volumes:
        - name: hubble-ui-envoy
          configMap:
            name: hubble-ui-envoy
---
apiVersion: v1
kind: Service
metadata:
  name: hubble-ui
  namespace: cilium-monitoring
spec:
  selector:
    app: hubble-ui
  ports:
    - name: http
      port: 80
      targetPort: 8081
  type: NodePort
