apiVersion: apps/v1
kind: Deployment
metadata:
  name: holmegpt
  namespace: holmegpt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: holmegpt
  template:
    metadata:
      labels:
        app: Holmegpt
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: Holmegpt-config
